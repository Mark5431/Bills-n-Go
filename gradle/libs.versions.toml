[versions]
agp = "9.0.1"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
playServicesMlkitDocumentScanner = "16.0.0"
mlkitTextRecognition = "16.0.1"

[libraries]
